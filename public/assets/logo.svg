<svg viewBox="0 0 580 130" width="580" height="130" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Professional Navy Gradient Background for Icon Box -->
    <linearGradient id="fullIconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1F38" />
      <stop offset="50%" stop-color="#0A1526" />
      <stop offset="100%" stop-color="#050B14" />
    </linearGradient>

    <!-- Professional Royal Blue to Speed Cyan Border Rim -->
    <linearGradient id="fullIconRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#0066FF" />
      <stop offset="80%" stop-color="#003B95" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Car Aerodynamic Stream Gradient -->
    <linearGradient id="fullCarStream" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <!-- Gear & Wrench Steel Blue Gradient -->
    <linearGradient id="fullGearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#003B95" />
    </linearGradient>

    <!-- Cyan to Royal Blue Text Gradient -->
    <linearGradient id="cyanBlueText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>

    <filter id="fullLogoGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0066FF" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- LEFT: Precision Hex/Shield Automotive Symbol -->
  <g transform="translate(10, 10)">
    <!-- Container Shield -->
    <rect x="0" y="0" width="110" height="110" rx="26" fill="url(#fullIconBg)" stroke="url(#fullIconRim)" stroke-width="2.5" />
    <circle cx="55" cy="55" r="42" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3 4" opacity="0.25" />

    <!-- Scaled Symbol Elements (Center 55, 55) -->
    <g transform="translate(4, 5) scale(0.55)">
      <!-- Gear -->
      <g transform="translate(68, 108)" fill="url(#fullGearGrad)">
        <path d="M -6,-28 L 6,-28 L 5,-22 C 8,-21 11,-19 14,-17 L 19,-20 L 27,-12 L 24,-7 C 26,-4 28,-1 29,2 L 35,3 L 35,15 L 29,16 C 28,19 26,22 24,25 L 27,30 L 19,38 L 14,35 C 11,37 8,39 5,40 L 6,46 L -6,46 L -5,40 C -8,39 -11,37 -14,35 L -19,38 L -27,30 L -24,25 C -26,22 -28,19 -29,16 L -35,15 L -35,3 L -29,2 C -28,-1 -26,-4 -24,-7 L -27,-12 L -19,-20 L -14,-17 C -11,-19 -8,-21 -5,-22 Z" opacity="0.95" />
        <circle cx="0" cy="9" r="14" fill="#0A1526" stroke="#38BDF8" stroke-width="2.5" />
        <circle cx="0" cy="9" r="6" fill="#38BDF8" />
      </g>

      <!-- Wrench -->
      <g transform="translate(132, 117) rotate(35)">
        <path d="M -16,-6 L -42,-6 C -44,-6 -46,-4 -46,-2 L -46,2 C -46,4 -44,6 -42,6 L -16,6 C -14,12 -8,16 0,16 C 9,16 16,9 16,0 C 16,-9 9,-16 0,-16 C -8,-16 -14,-12 -16,-6 Z M 0,-8 C 4.4,-8 8,-4.4 8,0 C 8,4.4 4.4,8 0,8 C -3,8 -5.6,6.3 -6.9,3.8 L 3,3.8 L 3,-3.8 L -6.9,-3.8 C -5.6,-6.3 -3,-8 0,-8 Z" fill="#60A5FA" opacity="0.9" />
      </g>

      <!-- Car Silhouette -->
      <path d="M 22 104 C 32 94, 46 64, 76 52 C 102 42, 130 46, 154 78 C 160 86, 168 96, 172 104 C 174 108, 166 110, 158 108 C 138 104, 114 96, 86 96 C 58 96, 38 102, 22 104 Z" fill="url(#fullCarStream)" />
      <path d="M 48 88 C 70 62, 106 56, 142 80" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
      <path d="M 80 78 L 94 62 C 108 60, 120 62, 128 76 Z" fill="#0A1526" stroke="#38BDF8" stroke-width="1.2" />
      <path d="M 132 76 C 138 72, 144 74, 148 78 L 136 80 Z" fill="#0A1526" stroke="#38BDF8" stroke-width="1.2" />
      <path d="M 158 98 L 174 102 L 160 106 Z" fill="#38BDF8" opacity="0.95" />
    </g>
  </g>

  <!-- RIGHT: Typography AUTO PARTS INDIA -->
  <g transform="translate(138, 12)">
    
    <!-- Row 1: AUTO PARTS -->
    <text x="0" y="52" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="-1">AUTO</text>
    <text x="135" y="52" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-style="italic" font-size="44" fill="url(#cyanBlueText)" letter-spacing="-0.5" filter="url(#fullLogoGlow)">PARTS</text>

    <!-- Micro Tricolor & INDIA Badge Block -->
    <g transform="translate(310, 22)">
      <!-- Saffron / White / Green subtle tricolor micropill -->
      <rect x="0" y="0" width="84" height="24" rx="6" fill="#0F1F38" stroke="#0052CC" stroke-width="1.2" />
      
      <!-- Tricolor indicator on left of INDIA tag -->
      <rect x="6" y="5" width="4" height="14" rx="1" fill="#FF9933" />
      <rect x="11" y="5" width="4" height="14" rx="1" fill="#FFFFFF" />
      <rect x="16" y="5" width="4" height="14" rx="1" fill="#138808" />

      <!-- INDIA text -->
      <text x="26" y="17" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="11" fill="#38BDF8" letter-spacing="1.5">INDIA</text>
    </g>

    <!-- Speed Divider Line (Deep Navy / Royal / Cyan) -->
    <rect x="0" y="66" width="410" height="3" rx="1.5" fill="#1E293B" opacity="0.7"/>
    <rect x="0" y="66" width="120" height="3" rx="1.5" fill="url(#fullCarStream)"/>
    <rect x="124" y="66" width="90" height="3" rx="1.5" fill="#0066FF"/>
    <circle cx="220" cy="67.5" r="3" fill="#38BDF8"/>

    <!-- Subtitle / Tagline -->
    <text x="0" y="88" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#94A3B8" letter-spacing="3.5">GENUINE AUTOMOTIVE SPARES MARKETPLACE</text>
  </g>
</svg>
