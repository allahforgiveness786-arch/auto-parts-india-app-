<svg viewBox="0 0 1600 1100" width="1600" height="1100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Mask to punch out gear hole and car negative spaces dynamically -->
    <mask id="gearMask">
      <!-- Everything white is kept -->
      <rect width="1600" height="1100" fill="#FFFFFF" />
      <!-- Black circle cuts hole in gear -->
      <circle cx="1025" cy="310" r="148" fill="#000000" />
    </mask>

    <mask id="carMask">
      <rect width="1600" height="1100" fill="#FFFFFF" />
      <!-- Cut windshield, headlights, grille in car -->
      <g transform="translate(800, 360) scale(2.05)" fill="#000000">
        <!-- Windshield -->
        <path d="M 0 -40 C 52 -40, 92 -26, 112 0 C 122 14, 124 28, 132 40 C 132 48, 124 50, 114 50 L -114 50 C -124 50, -132 48, -132 40 C -124 28, -122 14, -112 0 C -92 -26, -52 -40, 0 -40 Z" />
