        <path d="M 176 86 C 164 76, 132 76, 114 86 C 112 94, 122 106, 134 110 C 156 114, 176 106, 176 86 Z" />
        <!-- Lower Center Grille -->
        <path d="M -74 106 L 74 106 C 82 106, 84 111, 82 116 L 68 142 C 62 152, 52 158, 40 158 L -40 158 C -52 158, -62 152, -68 142 L -82 116 C -84 111, -82 106, -74 106 Z" />
      </g>
    </mask>
  </defs>

  <!-- GEAR (Masked with transparent center hole) -->
  <g mask="url(#gearMask)">
    <g transform="translate(1025, 310) scale(2.05)" fill="#FFFFFF">
      <!-- 8 Rounded Chunky Teeth -->
      <rect x="-24" y="-148" width="48" height="44" rx="14" />
      <rect x="-24" y="-148" width="48" height="44" rx="14" transform="rotate(45)" />
      <rect x="-24" y="-148" width="48" height="44" rx="14" transform="rotate(90)" />
      <rect x="-24" y="-148" width="48" height="44" rx="14" transform="rotate(135)" />
      <rect x="-24" y="-148" width="48" height="44" rx="14" transform="rotate(180)" />
      <rect x="-24" y="-148" width="48" height="44" rx="14" transform="rotate(225)" />
      <rect x="-24" y="-148" width="48" height="44" rx="14" transform="rotate(270)" />
      <rect x="-24" y="-148" width="48" height="44" rx="14" transform="rotate(315)" />
      <circle cx="0" cy="0" r="125" fill="#FFFFFF" />
    </g>
  </g>

  <!-- CAR BODY (Masked with transparent windshield & cutouts) -->
  <g mask="url(#carMask)">
    <g fill="#FFFFFF" transform="translate(800, 360) scale(2.05)">
      <rect x="-194" y="46" width="52" height="24" rx="12" />
      <rect x="142" y="46" width="52" height="24" rx="12" />
