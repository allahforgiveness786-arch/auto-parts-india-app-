<svg viewBox="0 0 200 200" width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueLogoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0080FF" />
      <stop offset="100%" stop-color="#0066E0" />
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="0" y="0" width="200" height="200" rx="44" fill="url(#blueLogoBg)" />

  <g transform="translate(0, 16) scale(0.95)">
    <!-- Gear in upper-right behind car -->
    <g transform="translate(136, 68)">
      <!-- Outer 8 Teeth -->
      <rect x="-7" y="-46" width="14" height="12" rx="3" fill="#FFFFFF" />
      <rect x="-7" y="-46" width="14" height="12" rx="3" fill="#FFFFFF" transform="rotate(45)" />
      <rect x="-7" y="-46" width="14" height="12" rx="3" fill="#FFFFFF" transform="rotate(90)" />
      <rect x="-7" y="-46" width="14" height="12" rx="3" fill="#FFFFFF" transform="rotate(135)" />
      <rect x="-7" y="-46" width="14" height="12" rx="3" fill="#FFFFFF" transform="rotate(180)" />
      <rect x="-7" y="-46" width="14" height="12" rx="3" fill="#FFFFFF" transform="rotate(225)" />
      <rect x="-7" y="-46" width="14" height="12" rx="3" fill="#FFFFFF" transform="rotate(270)" />
      <rect x="-7" y="-46" width="14" height="12" rx="3" fill="#FFFFFF" transform="rotate(315)" />
      <!-- Gear Ring -->
      <circle cx="0" cy="0" r="38" fill="#FFFFFF" />
      <!-- Gear Center Cutout Hole -->
      <circle cx="0" cy="0" r="23" fill="#0077F6" />
    </g>

    <!-- Side Mirrors -->
    <rect x="36" y="78" width="15" height="7" rx="3.5" fill="#FFFFFF" />
    <rect x="159" y="78" width="15" height="7" rx="3.5" fill="#FFFFFF" />

    <!-- Car Outer Body Shell -->
    <path
      d="M 105 50 C 122 50, 138 56, 148 68 C 152 73, 156 78, 160 82 C 162 83, 166 88, 166 98 C 166 106, 162 112, 156 114 L 150 114 C 150 118, 148 121, 144 121 L 134 121 C 130 121, 128 118, 128 114 L 82 114 C 82 118, 80 121, 76 121 L 66 121 C 62 121, 60 118, 60 114 L 54 114 C 48 112, 44 106, 44 98 C 44 88, 48 83, 50 82 C 54 78, 58 73, 62 68 C 72 56, 88 50, 105 50 Z"
      fill="#FFFFFF"
    />

    <!-- Windshield Cutout -->
    <path
      d="M 105 56 C 120 56, 132 60, 138 67 C 141 71, 142 75, 144 79 C 144 81, 142 82, 139 82 L 71 82 C 68 82, 66 81, 66 79 C 68 75, 69 71, 72 67 C 78 60, 90 56, 105 56 Z"
      fill="#0077F6"
    />

    <!-- Left Headlight Cutout -->
    <path
      d="M 53 90 C 57 87, 67 87, 72 90 C 73 92, 70 96, 66 97 C 59 98, 53 96, 53 90 Z"
      fill="#0077F6"
    />

    <!-- Right Headlight Cutout -->
    <path
      d="M 157 90 C 153 87, 143 87, 138 90 C 137 92, 140 96, 144 97 C 151 98, 157 96, 157 90 Z"
      fill="#0077F6"
    />

    <!-- Center Lower Bumper Grille Cutout -->
    <rect
      x="83"
      y="93"
      width="44"
      height="8"
      rx="4"
      fill="#0077F6"
    />
  </g>
</svg>
