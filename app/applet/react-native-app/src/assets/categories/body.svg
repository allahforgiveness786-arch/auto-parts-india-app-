<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="doorPaint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="40%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="glassTint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="chromeHandle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <ellipse cx="64" cy="104" rx="46" ry="12" fill="#000000" opacity="0.3" />
  <g filter="url(#shadow)">
    <!-- Car Body Shell 3D -->
    <path d="M 20 48 C 36 28 84 24 108 40 L 102 92 C 96 98 84 102 64 102 C 44 102 24 96 20 86 Z" fill="url(#doorPaint)"/>
    <!-- Tinted Window -->
    <path d="M 30 50 C 42 34 76 32 94 44 L 92 64 L 28 64 Z" fill="url(#glassTint)"/>
    <!-- Glass Reflection Streak -->
    <path d="M 38 48 L 52 46 L 46 62 L 34 62 Z" fill="#FFFFFF" opacity="0.25"/>
    <path d="M 58 45 L 72 43 L 66 62 L 54 62 Z" fill="#FFFFFF" opacity="0.15"/>
    <!-- Glossy Body Reflection -->
    <path d="M 20 48 C 36 28 84 24 108 40 L 104 56 C 80 42 36 44 20 60 Z" fill="#FFFFFF" opacity="0.2"/>
    <!-- Chrome Door Handle -->
    <rect x="68" y="72" width="22" height="7" rx="3.5" fill="url(#chromeHandle)"/>
    <!-- Side Mirror 3D -->
    <path d="M 94 56 C 104 54 112 58 108 66 C 102 70 94 66 94 62 Z" fill="#1E293B" stroke="url(#chromeHandle)" stroke-width="1.5"/>
  </g>
</svg>
