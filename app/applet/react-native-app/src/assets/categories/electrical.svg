<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="battBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <linearGradient id="battCap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="goldBolt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#EAB308" flood-opacity="0.8"/>
    </filter>
  </defs>
  <ellipse cx="64" cy="104" rx="42" ry="12" fill="#000000" opacity="0.3" />
  <g filter="drop-shadow(0px 8px 12px rgba(0,0,0,0.35))">
    <!-- Main 3D Battery Casing -->
    <path d="M 24 48 L 64 30 L 104 48 L 104 90 L 64 108 L 24 90 Z" fill="url(#battBody)"/>
    <!-- Battery Top Cap -->
    <path d="M 24 48 L 64 30 L 104 48 L 64 64 Z" fill="url(#battCap)"/>
    <!-- Top Highlight Rim -->
    <path d="M 24 48 L 64 30 L 104 48" stroke="#FFFFFF" stroke-width="2" opacity="0.5" fill="none"/>
    <!-- Terminals (+) & (-) -->
    <!-- Positive Terminal (Red) -->
    <path d="M 38 34 L 46 30 L 50 32 L 42 36 Z" fill="#EF4444"/>
    <rect x="41" y="24" width="6" height="10" rx="1" fill="#DC2626"/>
    <!-- Negative Terminal (Silver) -->
    <path d="M 82 54 L 90 50 L 94 52 L 86 56 Z" fill="#94A3B8"/>
    <rect x="85" y="44" width="6" height="10" rx="1" fill="#64748B"/>
    <!-- Glowing 3D Lightning Bolt -->
    <g filter="url(#glow)">
      <path d="M 70 42 L 48 72 L 62 72 L 54 96 L 82 62 L 66 62 Z" fill="url(#goldBolt)"/>
      <path d="M 68 44 L 50 70 L 62 70 L 58 90 L 78 64 L 66 64 Z" fill="#FFFFFF" opacity="0.4"/>
    </g>
  </g>
</svg>
