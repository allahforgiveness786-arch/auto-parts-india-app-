      <path d="M 32 0 L 0 16 L 32 32 L 64 16 Z" stroke="#FFFFFF" stroke-width="1.5" fill="none" opacity="0.5"/>
    </g>
    <!-- Bottom Left 3D Isometric Cube -->
    <g transform="translate(8, 48)">
      <path d="M 28 0 L 56 14 L 28 28 L 0 14 Z" fill="url(#cubeT)"/>
      <path d="M 0 14 L 28 28 L 28 56 L 0 42 Z" fill="url(#cubeL)"/>
      <path d="M 28 28 L 56 14 L 56 42 L 28 56 Z" fill="url(#cubeR)"/>
      <path d="M 28 0 L 0 14 L 28 28 L 56 14 Z" stroke="#FFFFFF" stroke-width="1.5" fill="none" opacity="0.5"/>
    </g>
    <!-- Bottom Right 3D Isometric Cube -->
    <g transform="translate(60, 48)">
      <path d="M 28 0 L 56 14 L 28 28 L 0 14 Z" fill="url(#cubeT)"/>
      <path d="M 0 14 L 28 28 L 28 56 L 0 42 Z" fill="url(#cubeL)"/>
      <path d="M 28 28 L 56 14 L 56 42 L 28 56 Z" fill="url(#cubeR)"/>
      <path d="M 28 0 L 0 14 L 28 28 L 56 14 Z" stroke="#FFFFFF" stroke-width="1.5" fill="none" opacity="0.5"/>
