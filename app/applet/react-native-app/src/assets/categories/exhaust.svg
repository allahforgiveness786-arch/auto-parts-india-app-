<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="mufflerBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="40%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="titaniumTip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="30%" stop-color="#8B5CF6" />
      <stop offset="70%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
  </defs>
  <ellipse cx="64" cy="104" rx="46" ry="12" fill="#000000" opacity="0.3" />
  <g filter="drop-shadow(0px 8px 12px rgba(0,0,0,0.3))">
    <!-- Inlet Pipe -->
    <path d="M 12 56 L 40 56 L 40 68 L 12 68 Z" fill="url(#mufflerBox)"/>
    <!-- Main Muffler Body 3D -->
    <rect x="34" y="32" width="52" height="60" rx="16" fill="url(#mufflerBox)"/>
    <!-- Muffler Ridges -->
    <line x1="48" y1="32" x2="48" y2="92" stroke="#475569" stroke-width="3" opacity="0.4"/>
    <line x1="72" y1="32" x2="72" y2="92" stroke="#475569" stroke-width="3" opacity="0.4"/>
    <path d="M 36 36 L 82 36" stroke="#FFFFFF" stroke-width="3" opacity="0.6"/>

    <!-- Twin Titanium Blue Flame Tailpipes -->
    <!-- Top Pipe -->
    <rect x="86" y="42" width="28" height="16" rx="4" fill="url(#titaniumTip)"/>
    <ellipse cx="114" cy="50" rx="4" ry="8" fill="#090D16"/>
    <path d="M 86 43 L 112 43" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
    <!-- Bottom Pipe -->
    <rect x="86" y="66" width="28" height="16" rx="4" fill="url(#titaniumTip)"/>
    <ellipse cx="114" cy="74" rx="4" ry="8" fill="#090D16"/>
    <path d="M 86 67 L 112 67" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
  </g>
</svg>
