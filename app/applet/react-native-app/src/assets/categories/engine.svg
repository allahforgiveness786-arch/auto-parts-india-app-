<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="engBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="engCover" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Glow & Shadow -->
  <ellipse cx="64" cy="100" rx="44" ry="14" fill="#000000" opacity="0.3" />
  <!-- Engine 3D Main Block -->
  <g filter="url(#shadow)">
    <!-- Bottom block -->
    <path d="M 24 64 L 64 84 L 104 64 L 104 88 L 64 108 L 24 88 Z" fill="url(#engBase)"/>
    <!-- Top Cylinder Head Cover -->
    <path d="M 24 44 L 64 24 L 104 44 L 104 64 L 64 84 L 24 64 Z" fill="url(#engCover)"/>
    <!-- Top Carbon Cap -->
    <path d="M 32 44 L 64 28 L 96 44 L 64 60 Z" fill="#090D16" opacity="0.8"/>
    <!-- Metallic Cylinder Ribs -->
    <path d="M 40 44 L 64 32 L 88 44" stroke="url(#chrome)" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 40 52 L 64 40 L 88 52" stroke="url(#chrome)" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Glossy Highlight Edge -->
    <path d="M 24 44 L 64 24 L 104 44" stroke="#FFFFFF" stroke-width="2" opacity="0.6" fill="none"/>
    <!-- Front Pulleys -->
    <circle cx="44" cy="80" r="10" fill="#0F172A" stroke="url(#chrome)" stroke-width="3"/>
    <circle cx="44" cy="80" r="4" fill="#64748B"/>
    <circle cx="84" cy="80" r="10" fill="#0F172A" stroke="url(#chrome)" stroke-width="3"/>
    <circle cx="84" cy="80" r="4" fill="#64748B"/>
    <!-- Belt -->
    <path d="M 44 70 L 84 70 M 44 90 L 84 90" stroke="#000000" stroke-width="4"/>
  </g>
</svg>
